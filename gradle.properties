# Gradle 自身的运行参数。Minecraft 反编译比较吃内存，别调太小。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=1 -Xss512k
org.gradle.daemon=false
org.gradle.workers.max=1

## 工具链版本
#
# 注意：这些键当前只作说明用途，build.gradle 里是写死的字面量。
# 改版本时以 build.gradle 的 minecraft { ... } 块为准，别只改这里。

minecraft_version=1.20.1
forge_version=47.4.20
mapping_channel=official
mapping_version=1.20.1

## 模组标识
#
# 模组的 id / 名称 / 版本 / 作者不在这里，而在：
#   - build.gradle        -> version / group / archivesBaseName
#   - src/main/resources/META-INF/mods.toml -> modId / displayName / authors / description
# 上游 MDK 模板会在这里放一份 mod_id / mod_name / mod_license，本项目没有使用，已移除，
# 免得改了这里以为生效、实际读的是别处。
