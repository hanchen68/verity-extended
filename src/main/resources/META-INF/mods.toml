modLoader="javafml"
loaderVersion="[47,)"

license="MIT"
authors="涵辰"
issueTrackerURL="https://space.bilibili.com/3493111946807804"
displayURL="https://verity.xrstudio.cn/"

[[mods]]
modId="verity_extended"
version="${version}"
displayName="Verity 扩展增强"
logoFile="verity_extended_logo.png"
description='''Verity 扩展增强 ${version}

为 Verity JE 带来更丰富、更方便的游玩体验

网站：https://verity.xrstudio.cn/

开发：星绒工作室'''

[[dependencies."verity_extended"]]
modId="forge"
mandatory=true
# 5.0 起放宽到 47.3：编译基准是 47.3.0（见 build.gradle），所以 47.3.x 全系列 + 47.4.x 都能跑。
# 原版 Verity 6.0.0 自己只要求 [47,)，真正卡住旧整合包的只有这一行。
versionRange="[47.3,48)"
ordering="NONE"
side="BOTH"

[[dependencies."verity_extended"]]
modId="verity"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# MMD 骨骼动画直接引用 software.bernie.geckolib.*（MmdPlaybackManager / VerityDemonMmdMixin）。
# 原版 Verity 已经把 geckolib 声明为 mandatory，所以实际不会缺失；这里显式声明是为了
# 万一缺失时 Forge 能给出明确提示，而不是让我们在启动阶段抛 NoClassDefFoundError。
[[dependencies."verity_extended"]]
modId="geckolib"
mandatory=true
versionRange="[4.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies."verity_extended"]]
modId="cloth_config"
mandatory=false
versionRange="[11,13)"
ordering="AFTER"
side="CLIENT"

[[dependencies."verity_extended"]]
modId="patpat"
mandatory=false
versionRange="[1.3.1,2)"
ordering="AFTER"
side="CLIENT"

[[dependencies."verity_extended"]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="BOTH"
